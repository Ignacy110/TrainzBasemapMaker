<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        #map {
            height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        /* Number labels on selected tiles (circular / compact) */
        .tile-number-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            box-sizing: border-box;
            background: rgba(0, 102, 204, 0.92);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 11px;
            border-radius: 12px;
            padding: 0 4px;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .tile-number-label.downloading {
            background: rgba(255, 153, 0, 0.95);
            border-color: #fff;
            animation: pulse 1s infinite alternate;
        }

        .tile-number-label.done {
            background: rgba(40, 167, 69, 0.95);
            border-color: #fff;
        }

        .tile-number-label.error {
            background: rgba(220, 53, 69, 0.95);
            border-color: #fff;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* Rubber-band box selection overlay */
        .selection-box {
            position: absolute;
            border: 2px dashed #0078d4;
            background-color: rgba(0, 120, 212, 0.2);
            pointer-events: none;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="selectionBox" class="selection-box"></div>

    <script src="grid_map_script.js"></script>
</body>
</html>
